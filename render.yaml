# Reference blueprint for a NEW test service only. Existing Render service: keep its current settings.
services:
  - type: web
    name: opera-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_URL
        sync: false

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>OPERA AI | Dépôt documentaire</title><style>body{font:16px system-ui;background:#0b1518;color:#edf5f3;margin:0;padding:24px}main{max-width:520px;margin:9vh auto;background:#142527;border:1px solid #34534e;border-radius:24px;padding:32px}h1{font-size:30px}strong{color:#85efbf}p{color:#b5c9c5;line-height:1.6}input{display:block;width:100%;margin:24px 0}button{background:#85efbf;border:0;border-radius:12px;padding:14px 24px;color:#0b1518;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.6}#status{color:#edf5f3}</style></head><body><main><strong>OPERA AI</strong><h1>Transmettre un document</h1><p>Ce lien à usage unique permet de transmettre un PDF à l'entreprise qui vous l'a envoyé. Le fichier sera vérifié et soumis à validation. Ne déposez que des documents fictifs pendant cette phase de test.</p><form id="form"><label for="file">Document PDF — 10 Mo maximum</label><input id="file" type="file" accept=".pdf,application/pdf" required><button id="send">Transmettre le document</button></form><p id="status" role="status" aria-live="polite"></p></main><script>const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const form=document.getElementById('form'),status=document.getElementById('status'),send=document.getElementById('send');if(!/^[A-Za-z0-9_-]{43}$/.test(token)){form.hidden=true;status.textContent='Lien incomplet ou invalide.'}form.onsubmit=async e=>{e.preventDefault();if(send.disabled)return;const f=document.getElementById('file').files[0];if(!f||f.size>10485760){status.textContent='Sélectionnez un PDF de 10 Mo maximum.';return}send.disabled=true;status.textContent='Vérification et transfert…';try{const data=new FormData();data.append('token',token);data.append('file',f);const r=await fetch('/api/public/deposit',{method:'POST',body:data,credentials:'omit'});const j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'Transfert impossible');form.hidden=true;status.textContent='Document transmis. Il sera vérifié par le destinataire.'}catch(e){status.textContent=e.message;send.disabled=false}};</script></body></html>
